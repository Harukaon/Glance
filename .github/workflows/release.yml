name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Package portable Windows ZIP
        if: matrix.label == 'windows-x64'
        shell: pwsh
        run: |
          $portableDir = Join-Path $env:RUNNER_TEMP 'Glance-portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item 'src-tauri/target/${{ matrix.target }}/release/glance.exe' (Join-Path $portableDir 'Glance.exe')
          @'
          Glance Windows 便携版

          无需安装，解压后直接运行 Glance.exe。
          Windows 10/11 通常已内置 Microsoft Edge WebView2 Runtime；若启动失败，
          请安装 Evergreen WebView2 Runtime 后重试：
          https://developer.microsoft.com/microsoft-edge/webview2/
          '@ | Set-Content -Encoding utf8 (Join-Path $portableDir 'README.txt')
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath 'Glance-windows-x64-portable.zip' -Force

      - name: Force Ad-hoc signing (macOS only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          # Use force ad-hoc signing to ensure the bundle is structurally valid on ARM64
          find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app" -exec codesign --force --deep --sign - {} \;
          # Create a ZIP as a more reliable alternative for unsigned apps
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          zip -r "$GITHUB_WORKSPACE/glance-${{ matrix.label }}.zip" Glance.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glance-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            Glance-windows-x64-portable.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            glance-${{ matrix.label }}.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.app
            artifacts/**/*.deb
            artifacts/**/*.AppImage
          generate_release_notes: true
